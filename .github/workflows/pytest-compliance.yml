name: Automated Compliance & Test Suite

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  validate-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code Repository
      uses: actions/checkout@v4

    - name: Set up Python Runtime
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install System CV2 Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libgl1-mesa-glx libglib2.0-0

    # 1. Force down the package overhead footprint before parsing requirements.txt
    - name: Pre-Install Lightweight CPU Machine Learning Base
      run: |
        python -m pip install --upgrade pip
        pip install torch torchvision --index-url https://pytorch.org

    # 2. Build the remaining tools safely inside the container constraints
    - name: Install Remaining Architecture Dependencies
      run: |
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    # 3. Explicitly execute the relative test route mapping layer
    - name: Execute Pytest Validation Gate
      run: |
        python -m pytest ./test_app.py -v
