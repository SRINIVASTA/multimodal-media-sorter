name: ComplianceSuite

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  validate-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code Repository
      uses: actions/checkout@v4

    - name: Set up Python Runtime
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install System CV2 Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libgl1-mesa-glx libglib2.0-0

    - name: Install Lightweight Testing Framework
      run: |
        python -m pip install --upgrade pip
        pip install pytest streamlit opencv-python-headless numpy requests

    - name: Execute Pytest Validation Gate
      run: |
        python -m pytest ./test_app.py -v
